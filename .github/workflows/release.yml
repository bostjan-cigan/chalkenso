# A version tag (v1.2.3) publishes the Docker image and makes the release, with the source of that
# version as a zip. The tests run before a release is cut, not here.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The version's source as a zip
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="chalkenso-$version/" -o "chalkenso-$version.zip" HEAD
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "chalkenso-$version.zip" \
            --title "Chalkenso $version" \
            --generate-notes
